<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trax Radio UK - Feature Graphic</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #1976D2 0%, #42A5F5 100%);
            font-family: 'Roboto', 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .radio-waves {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            opacity: 0.3;
        }

        .wave {
            position: absolute;
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .wave:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 110px;
            left: 110px;
            animation-delay: 0s;
        }

        .wave:nth-child(2) {
            width: 140px;
            height: 140px;
            top: 80px;
            left: 80px;
            animation-delay: 0.5s;
        }

        .wave:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 50px;
            left: 50px;
            animation-delay: 1s;
        }

        .wave:nth-child(4) {
            width: 260px;
            height: 260px;
            top: 20px;
            left: 20px;
            animation-delay: 1.5s;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.3;
            }

            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        .app-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #1976D2;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .main-title {
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-align: center;
            margin: 0 0 10px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            z-index: 5;
        }

        .subtitle {
            font-size: 24px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin: 0 0 30px 0;
            z-index: 5;
        }

        .features {
            display: flex;
            gap: 40px;
            margin-top: 20px;
            z-index: 5;
        }

        .feature {
            display: flex;
            align-items: center;
            color: white;
            font-size: 16px;
            font-weight: 500;
        }

        .feature-icon {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #1976D2;
        }

        .music-notes {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 24px;
            animation: float 3s infinite ease-in-out;
        }

        .music-notes:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .music-notes:nth-child(2) {
            top: 70%;
            right: 15%;
            animation-delay: 1s;
        }

        .music-notes:nth-child(3) {
            top: 30%;
            right: 10%;
            animation-delay: 2s;
        }

        .music-notes:nth-child(4) {
            top: 80%;
            left: 20%;
            animation-delay: 1.5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
                opacity: 0.4;
            }

            50% {
                transform: translateY(-10px);
                opacity: 0.7;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Radio Waves Animation -->
        <div class="radio-waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>

        <!-- App Icon -->
        <div class="app-icon">🎵</div>

        <!-- Music Notes -->
        <div class="music-notes">♪</div>
        <div class="music-notes">♫</div>
        <div class="music-notes">♪</div>
        <div class="music-notes">♫</div>

        <!-- Main Content -->
        <h1 class="main-title">Trax Radio UK</h1>
        <p class="subtitle">Live Streaming Radio Experience</p>

        <!-- Features -->
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📻</div>
                Live Streaming
            </div>
            <div class="feature">
                <div class="feature-icon">🎧</div>
                Real-time DJ Info
            </div>
            <div class="feature">
                <div class="feature-icon">🎨</div>
                Audio Visualization
            </div>
        </div>
    </div>
</body>

</html>
